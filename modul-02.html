// Audio Synthesizer Web Audio API
const AudioFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  playJump() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  },
  playCoin() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
    osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  },
  playStomp() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
  },
  playBump() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  },
  playBreak() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  },
  playPowerup() {
    if (!this.ctx) return;
    const notes = [330, 392, 659, 523, 587, 784];
    notes.forEach((freq, i) => {
      let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.05);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.05);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (i + 1) * 0.05);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.05);
      osc.stop(this.ctx.currentTime + (i + 1) * 0.05);
    });
  },
  playPowerdown() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(150, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  },
  playDie() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.6);
  }
};

function create() {
  const unlockAudio = () => { AudioFX.init(); };
  this.input.on('pointerdown', unlockAudio);
  this.input.keyboard.on('keydown', unlockAudio);

  const levelWidth = 2400;
  this.physics.world.setBounds(0, 0, levelWidth, 600);
  this.cameras.main.setBounds(0, 0, levelWidth, 600);

  for (let x = 100; x < levelWidth; x += Phaser.Math.Between(200, 400)) {
    this.add.image(x, Phaser.Math.Between(50, 180), 'cloud').setAlpha(0.8).setScale(1.5);
  }

  groundGroup = this.physics.add.staticGroup();
  brickGroup = this.physics.add.staticGroup();
  questionGroup = this.physics.add.staticGroup();
  pipeGroup = this.physics.add.staticGroup();
  enemyGroup = this.physics.add.group();
  coinGroup = this.physics.add.group();
  mushroomGroup = this.physics.add.group();

  for (let x = 16; x < levelWidth; x += 32) {
    if ((x >= 600 && x <= 672) || (x >= 1300 && x <= 1372)) continue;
    groundGroup.create(x, 552, 'ground').setScale(2).refreshBody();
    this.add.image(x, 584, 'ground').setScale(2);
  }

  const createPipe = (x, height) => {
    pipeGroup.create(x, 536 - (height * 32), 'pipeTop').setScale(2).refreshBody();
    for (let h = 0; h < height; h++) {
      pipeGroup.create(x, 536 - (h * 32), 'pipeBody').setScale(2).refreshBody();
    }
  };
  createPipe(300, 1);
  createPipe(500, 2);
  createPipe(900, 2);
  createPipe(1500, 3);

  const createBrick = (x, y) => brickGroup.create(x, y, 'brick').setScale(2).refreshBody();
  const createQBlock = (x, y, contentType = 'coin') => {
    let q = questionGroup.create(x, y, 'questionBlock').setScale(2).refreshBody();
    q.contentType = contentType;
    return q;
  };

  createQBlock(200, 360, 'coin');
  createBrick(260, 360);
  createQBlock(292, 360, 'mushroom_super');
  createBrick(324, 360);
  createQBlock(356, 360, 'coin');

  for (let i = 0; i < 4; i++) {
    for (let j = 0; j <= i; j++) {
      createBrick(1000 + i * 32, 504 - j * 32);
    }
  }

  createQBlock(1200, 360, 'mushroom_1up');
  createQBlock(1260, 240, 'coin');

  for (let cx = 750; cx <= 850; cx += 32) {
    let c = coinGroup.create(cx, 340, 'coin').setScale(1.5);
    c.body.setAllowGravity(false);
  }

  const spawnGoomba = (x) => {
    let g = enemyGroup.create(x, 500, 'goomba').setScale(2);
    g.setCollideWorldBounds(true);
    g.setBounce(1, 0);
    g.setVelocityX(-60);
  };
  spawnGoomba(420);
  spawnGoomba(780);
  spawnGoomba(1100);
  spawnGoomba(1400);
  spawnGoomba(1650);

  player = this.physics.add.sprite(50, 450, 'mario_idle').setScale(2);
  player.setCollideWorldBounds(true);
  player.body.setGravityY(200);
  player.body.setSize(12, 26).setOffset(2, 6);
  player.setDragX(600);

  this.anims.create({
    key: 'walk',
    frames: [{ key: 'mario_walk1' }, { key: 'mario_walk2' }],
    frameRate: 10,
    repeat: -1
  });

  this.cameras.main.startFollow(player, true, 0.1, 0.1);

  this.physics.add.collider(player, groundGroup);
  this.physics.add.collider(player, pipeGroup);
  this.physics.add.collider(enemyGroup, groundGroup);
  this.physics.add.collider(enemyGroup, pipeGroup);
  this.physics.add.collider(enemyGroup, brickGroup);
  this.physics.add.collider(enemyGroup, questionGroup);
  this.physics.add.collider(enemyGroup, enemyGroup);

  this.physics.add.collider(mushroomGroup, groundGroup);
  this.physics.add.collider(mushroomGroup, pipeGroup);
  this.physics.add.collider(mushroomGroup, brickGroup);
  this.physics.add.collider(mushroomGroup, questionGroup);

  this.physics.add.collider(player, brickGroup, (p, brick) => {
    if (p.body.touching.up && brick.body.touching.down) {
      if (isBig) {
        AudioFX.playBreak();
        score += 50;
        updateHUD();
        brick.destroy();
      } else {
        AudioFX.playBump();
        if (!brick.isBumping) {
          brick.isBumping = true;
          this.tweens.add({
            targets: brick,
            y: brick.y - 8,
            duration: 60,
            yoyo: true,
            onComplete: () => {
              brick.isBumping = false;
              brick.refreshBody();
            }
          });
        }
      }
    }
  });

  this.physics.add.collider(player, questionGroup, (p, qBlock) => {
    if (p.body.touching.up && qBlock.body.touching.down && qBlock.texture.key === 'questionBlock') {
      qBlock.setTexture('emptyBlock');

      if (qBlock.contentType === 'coin') {
        AudioFX.playCoin();
        score += 200;
        coins++;
        updateHUD();

        let coinPop = this.add.image(qBlock.x, qBlock.y - 20, 'coin').setScale(1.5);
        this.tweens.add({
          targets: coinPop,
          y: qBlock.y - 50,
          alpha: 0,
          duration: 300,
          onComplete: () => coinPop.destroy()
        });
      } else {
        spawnMushroom.call(this, qBlock.x, qBlock.y, qBlock.contentType);
      }
    }
  });

  this.physics.add.overlap(player, mushroomGroup, (p, shroom) => {
    let type = shroom.shroomType;
    shroom.destroy();

    if (type === 'mushroom_super') {
      AudioFX.playPowerup();
      score += 1000;
      updateHUD();

      if (!isBig) {
        isBig = true;
        p.setScale(2.5);
        p.body.setSize(12, 28).setOffset(2, 4);

        this.tweens.add({
          targets: p,
          alpha: 0.5,
          duration: 50,
          yoyo: true,
          repeat: 5,
          onComplete: () => p.setAlpha(1)
        });
      }
    } else if (type === 'mushroom_1up') {
      AudioFX.playPowerup();
      lives++;
      score += 1000;
      updateHUD();

      let txt = this.add.text(shroom.x - 20, shroom.y - 20, '+1 LIFE', { fontSize: '14px', color: '#00ff00', fontFamily: 'monospace' });
      this.tweens.add({
        targets: txt,
        y: txt.y - 40,
        alpha: 0,
        duration: 800,
        onComplete: () => txt.destroy()
      });
    }
  });

  this.physics.add.overlap(player, coinGroup, (p, coin) => {
    coin.destroy();
    AudioFX.playCoin();
    score += 100;
    coins++;
    updateHUD();
  });

  this.physics.add.collider(player, enemyGroup, (p, enemy) => {
    if (enemy.isStomped) return;

    if (p.body.touching.down && enemy.body.touching.up) {
      AudioFX.playStomp();
      p.setVelocityY(-320);
      score += 100;
      updateHUD();

      enemy.isStomped = true;
      enemy.setTexture('goomba_flat');
      enemy.setVelocityX(0);
      enemy.body.enable = false;

      this.time.delayedCall(300, () => enemy.destroy());
    } else {
      if (isInvulnerable) return;

      if (isBig) {
        isBig = false;
        isInvulnerable = true;
        AudioFX.playPowerdown();

        p.setScale(2);
        p.body.setSize(12, 26).setOffset(2, 6);

        this.tweens.add({
          targets: p,
          alpha: 0.3,
          duration: 100,
          yoyo: true,
          repeat: 12,
          onComplete: () => {
            p.setAlpha(1);
            isInvulnerable = false;
          }
        });
      } else {
        playerHit.call(this);
      }
    }
  });

  cursors = this.input.keyboard.createCursorKeys();
  shiftKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);
  jumpKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

  scoreText = this.add.text(20, 20, 'MARIO\\n000000', { fontSize: '14px', color: '#ffffff', fontFamily: 'monospace' }).setScrollFactor(0);
  coinText = this.add.text(140, 20, 'COINS\\n*x00', { fontSize: '14px', color: '#ffffff', fontFamily: 'monospace' }).setScrollFactor(0);
  worldText = this.add.text(250, 20, 'WORLD\\n 1-1', { fontSize: '14px', color: '#ffffff', fontFamily: 'monospace' }).setScrollFactor(0);
  livesText = this.add.text(350, 20, 'LIVES\\n  x3', { fontSize: '14px', color: '#ffffff', fontFamily: 'monospace' }).setScrollFactor(0);
}

function spawnMushroom(x, y, type) {
  let shroom = mushroomGroup.create(x, y - 16, type).setScale(2);
  shroom.shroomType = type;
  shroom.setCollideWorldBounds(true);
  shroom.setBounce(1, 0);

  shroom.body.setAllowGravity(false);
  this.tweens.add({
    targets: shroom,
    y: y - 32,
    duration: 300,
    onComplete: () => {
      if (shroom.active) {
        shroom.body.setAllowGravity(true);
        shroom.setVelocityX(80);
      }
    }
  });
}

function update() {
  if (isDead) return;

  const isRunning = shiftKey.isDown;
  const accel = isRunning ? 500 : 320;
  const maxVelocityX = isRunning ? 260 : 160;

  player.setMaxVelocity(maxVelocityX, 600);

  if (cursors.left.isDown) {
    player.setAccelerationX(-accel);
    player.setFlipX(true);
    if (player.body.touching.down) player.anims.play('walk', true);
  } else if (cursors.right.isDown) {
    player.setAccelerationX(accel);
    player.setFlipX(false);
    if (player.body.touching.down) player.anims.play('walk', true);
  } else {
    player.setAccelerationX(0);
    if (player.body.touching.down) {
      player.anims.stop();
      player.setTexture('mario_idle');
    }
  }

  const isJumpPressed = Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(jumpKey);
  const isJumpHolding = cursors.up.isDown || jumpKey.isDown;

  if (isJumpPressed && player.body.touching.down) {
    player.setVelocityY(-380);
    isJumping = true;
    AudioFX.playJump();
  }

  if (isJumping && isJumpHolding && player.body.velocity.y < 0) {
    player.body.velocity.y -= 12;
  }

  if (!isJumpHolding || player.body.velocity.y >= 0) {
    isJumping = false;
  }

  if (!player.body.touching.down) {
    player.anims.stop();
    player.setTexture('mario_jump');
  }

  enemyGroup.getChildren().forEach(enemy => {
    if (enemy.y > 550) {
      enemy.destroy();
    }
  });

  if (player.y > 550) {
    playerHit.call(this);
  }
}

function updateHUD() {
  scoreText.setText('MARIO\\n' + String(score).padStart(6, '0'));
  coinText.setText('COINS\\n*x' + String(coins).padStart(2, '0'));
  livesText.setText('LIVES\\n  x' + lives);
}

function playerHit() {
  if (isDead) return;
  isDead = true;
  isBig = false;
  AudioFX.playDie();
  lives--;
  updateHUD();

  player.anims.stop();
  player.setTexture('mario_die');
  player.setScale(2);
  player.body.setEnable(false);

  this.tweens.add({
    targets: player,
    y: player.y - 60,
    duration: 300,
    ease: 'Power1',
    onComplete: () => {
      this.tweens.add({
        targets: player,
        y: 650,
        duration: 800,
        ease: 'Power1',
        onComplete: () => {
          if (lives > 0) {
            isDead = false;
            player.body.setEnable(true);
            player.setPosition(50, 450);
          } else {
            this.add.text(this.cameras.main.scrollX + 130, 280, 'GAME OVER', { fontSize: '32px', color: '#ef4444', fontFamily: 'monospace' }).setScrollFactor(0);
          }
        }
      });
    }
  });
}
