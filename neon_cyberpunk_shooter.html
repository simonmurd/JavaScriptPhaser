<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERSTRIKE: Neon Odyssey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #05050a;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #0f0c1b 0%, #030206 100%);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .neon-box {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.6);
        }
        .neon-btn {
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
            border: 1px solid #ff0080;
        }
        .neon-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.9), 0 0 40px rgba(255, 0, 128, 0.6);
            background-color: rgba(255, 0, 128, 0.2);
            transform: scale(1.05);
        }
        .scanner-line {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(0,243,255,0.1) 50%, rgba(255,255,255,0));
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body class="relative w-screen h-screen flex items-center justify-center">

    <div class="absolute inset-0 scanner-line pointer-events-none z-10"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#1a103c_1px,transparent_1px)] [background-size:32px_32px] opacity-20 pointer-events-none z-0"></div>

    <canvas id="gameCanvas" class="absolute inset-0 z-0"></canvas>

    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-20 pointer-events-none hidden">
        <div class="flex items-center space-x-6">
            <div class="flex flex-col">
                <span class="text-xs text-cyan-400 tracking-widest">INTEGRITY</span>
                <div class="w-48 h-4 bg-gray-900 rounded-full overflow-hidden border border-cyan-500/50 p-0.5 mt-1">
                    <div id="healthBar" class="h-full bg-gradient-to-r from-cyan-500 to-pink-500 rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
            <div class="flex flex-col">
                <span class="text-xs text-pink-400 tracking-widest">SHIELD</span>
                <div class="w-32 h-3 bg-gray-900 rounded-full overflow-hidden border border-pink-500/50 p-0.5 mt-1">
                    <div id="shieldBar" class="h-full bg-cyan-400 rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-8">
            <div class="text-right">
                <div class="text-xs text-cyan-400 tracking-widest">WAVE</div>
                <div id="waveDisplay" class="text-2xl font-black text-cyan-300 neon-glow">01</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-pink-400 tracking-widest">SCORE</div>
                <div id="scoreDisplay" class="text-3xl font-black text-pink-500 neon-glow">000000</div>
            </div>
        </div>
    </div>

    <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-black/80 backdrop-blur-md">
        <div class="text-center p-8 max-w-xl neon-box bg-black/60 rounded-2xl relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-cyan-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-pink-500/20 rounded-full blur-3xl"></div>
            
            <h1 class="text-6xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 neon-glow mb-2">CYBERSTRIKE</h1>
            <p class="text-xs text-cyan-300/70 tracking-[0.3em] mb-8">NEON ODYSSEY V2.4</p>
            
            <div class="space-y-4 text-sm text-gray-300 mb-8 text-left bg-black/40 p-4 rounded-xl border border-cyan-500/30">
                <div class="flex justify-between"><span>MOVE:</span> <span class="text-cyan-400 font-bold">W, A, S, D / ARROWS</span></div>
                <div class="flex justify-between"><span>AIM & SHOOT:</span> <span class="text-cyan-400 font-bold">MOUSE / HOLD CLICK</span></div>
                <div class="flex justify-between"><span>SPECIAL ABILITY:</span> <span class="text-cyan-400 font-bold">SPACEBAR</span></div>
            </div>

            <button id="startBtn" class="neon-btn w-full py-4 rounded-xl text-lg font-black tracking-widest text-white uppercase bg-gradient-to-r from-pink-600 to-purple-600 cursor-pointer">
                INITIALIZE MISSION
            </button>
            <div id="highScoreText" class="mt-4 text-xs text-gray-400 tracking-widest">HIGH SCORE: 0</div>
        </div>
    </div>

    <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center z-30 bg-black/90 backdrop-blur-lg hidden">
        <div class="text-center p-8 max-w-md neon-box bg-black/80 rounded-2xl border-pink-500">
            <h2 class="text-5xl font-black text-pink-500 neon-glow mb-2">MISSION FAILED</h2>
            <p class="text-xs text-gray-400 tracking-widest mb-6">VESSEL DESTROYED IN COMBAT</p>
            
            <div class="bg-gray-900/60 p-4 rounded-xl mb-6 border border-gray-800">
                <div class="text-xs text-cyan-400">FINAL SCORE</div>
                <div id="finalScore" class="text-4xl font-black text-white my-1">0</div>
                <div id="newHighScoreNotice" class="text-xs text-pink-400 font-bold hidden animate-pulse">★ NEW HIGH SCORE RECORDED ★</div>
            </div>

            <button id="restartBtn" class="neon-btn w-full py-4 rounded-xl text-lg font-black tracking-widest text-white uppercase bg-gradient-to-r from-cyan-600 to-blue-600 cursor-pointer">
                RE-ENGAGE COMBAT
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive resizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Audio context generator for retro neon sounds
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'shoot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'explosion') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                // Ignore audio restriction errors
            }
        }

        // Game state variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('cyberstrike_highscore') || 0;
        let wave = 1;
        let waveTimer = 0;
        let enemiesToSpawn = 0;
        let spawnInterval = 90;
        let spawnCounter = 0;

        document.getElementById('highScoreText').innerText = `HIGH SCORE: ${highScore}`;

        // Input tracking
        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => { mouse.down = true; });
        window.addEventListener('mouseup', () => { mouse.down = false; });

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 18;
                this.speed = 5;
                this.health = 100;
                this.maxHealth = 100;
                this.shield = 100;
                this.maxShield = 100;
                this.shootCooldown = 0;
                this.weaponLevel = 1;
                this.color = '#00f3ff';
            }

            update() {
                // Movement
                let dx = 0;
                let dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // Boundary clamping
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // Shield regeneration
                if (this.shield < this.maxShield) {
                    this.shield += 0.1;
                }

                // Shooting
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (mouse.down && this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = Math.max(6, 15 - (this.weaponLevel * 2));
                }
            }

            shoot() {
                playSound('shoot');
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

                if (this.weaponLevel === 1) {
                    bullets.push(new Bullet(this.x, this.y, angle, '#00f3ff'));
                } else if (this.weaponLevel === 2) {
                    bullets.push(new Bullet(this.x, this.y, angle - 0.1, '#00f3ff'));
                    bullets.push(new Bullet(this.x, this.y, angle + 0.1, '#00f3ff'));
                } else {
                    bullets.push(new Bullet(this.x, this.y, angle, '#ff0080'));
                    bullets.push(new Bullet(this.x, this.y, angle - 0.15, '#00f3ff'));
                    bullets.push(new Bullet(this.x, this.y, angle + 0.15, '#00f3ff'));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                ctx.rotate(angle + Math.PI / 2);

                // Glow & Shield aura
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                if (this.shield > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 243, 255, ${this.shield / this.maxShield * 0.5})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Ship Hull
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(-this.radius + 4, this.radius);
                ctx.lineTo(0, this.radius - 6);
                ctx.lineTo(this.radius - 4, this.radius);
                ctx.closePath();
                ctx.fillStyle = '#050510';
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Engine flame
                ctx.beginPath();
                ctx.moveTo(-4, this.radius);
                ctx.lineTo(0, this.radius + 12 + Math.random() * 6);
                ctx.lineTo(4, this.radius);
                ctx.fillStyle = '#ff0080';
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle, color) {
                this.x = x;
                this.y = y;
                this.speed = 14;
                this.dx = Math.cos(angle) * this.speed;
                this.dy = Math.sin(angle) * this.speed;
                this.radius = 4;
                this.color = color;
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speedMultiplier = 1) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 4 + 1) * speedMultiplier;
                this.dx = Math.cos(angle) * speed;
                this.dy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.dx;
                this.y += this.dy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'drone', 'striker', 'tank'
                
                if (type === 'drone') {
                    this.radius = 14;
                    this.speed = 2.2 + wave * 0.1;
                    this.health = 20;
                    this.maxHealth = 20;
                    this.color = '#ff0055';
                    this.points = 100;
                } else if (type === 'striker') {
                    this.radius = 18;
                    this.speed = 1.6 + wave * 0.1;
                    this.health = 50;
                    this.maxHealth = 50;
                    this.color = '#ffaa00';
                    this.points = 250;
                } else { // tank
                    this.radius = 28;
                    this.speed = 0.9 + wave * 0.05;
                    this.health = 120;
                    this.maxHealth = 120;
                    this.color = '#a855f7';
                    this.points = 500;
                }
            }

            update(targetX, targetY) {
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                if (this.type === 'drone') {
                    ctx.rotate(Date.now() * 0.005);
                    ctx.beginPath();
                    for (let i = 0; i < 3; i++) {
                        const angle = (i * Math.PI * 2) / 3;
                        ctx.lineTo(Math.cos(angle) * this.radius, Math.sin(angle) * this.radius);
                    }
                    ctx.closePath();
                    ctx.fillStyle = '#050510';
                    ctx.fill();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (this.type === 'striker') {
                    ctx.rotate(Date.now() * -0.003);
                    ctx.beginPath();
                    ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                    ctx.fillStyle = '#050510';
                    ctx.fill();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#050510';
                    ctx.fill();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Health bar for tougher enemies
                if (this.health < this.maxHealth) {
                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                    ctx.fillRect(-15, -this.radius - 8, 30, 4);
                    ctx.fillStyle = '#00f3ff';
                    ctx.fillRect(-15, -this.radius - 8, 30 * (this.health / this.maxHealth), 4);
                }

                ctx.restore();
            }
        }

        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'health', 'weapon', 'shield'
                this.radius = 12;
                this.duration = 600; // time before despawn
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.type === 'health' ? '#00ff66' : (this.type === 'weapon' ? '#ff0080' : '#00f3ff');
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + Math.sin(Date.now() * 0.01) * 2, 0, Math.PI * 2);
                ctx.fillStyle = '#050510';
                ctx.fill();
                ctx.strokeStyle = this.type === 'health' ? '#00ff66' : (this.type === 'weapon' ? '#ff0080' : '#00f3ff');
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = ctx.strokeStyle;
                ctx.font = 'bold 10px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'health' ? 'HP' : (this.type === 'weapon' ? 'WPN' : 'SHD'), 0, 0);

                ctx.restore();
            }
        }

        let player = null;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let powerUps = [];

        function spawnWave() {
            enemiesToSpawn = 5 + wave * 4;
            spawnInterval = Math.max(30, 90 - wave * 5);
            document.getElementById('waveDisplay').innerText = String(wave).padStart(2, '0');
        }

        function createExplosion(x, y, color, count = 20) {
            playSound('explosion');
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 1.5));
            }
        }

        function startGame() {
            initAudio();
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            powerUps = [];
            score = 0;
            wave = 1;
            spawnCounter = 0;
            spawnWave();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'PLAYING';
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'PLAYING') {
                // Enemy spawning logic
                spawnCounter++;
                if (spawnCounter >= spawnInterval && enemiesToSpawn > 0) {
                    spawnCounter = 0;
                    enemiesToSpawn--;

                    // Spawn from random screen edges
                    let ex, ey;
                    if (Math.random() < 0.5) {
                        ex = Math.random() < 0.5 ? -30 : canvas.width + 30;
                        ey = Math.random() * canvas.height;
                    } else {
                        ex = Math.random() * canvas.width;
                        ey = Math.random() < 0.5 ? -30 : canvas.height + 30;
                    }

                    let type = 'drone';
                    const rand = Math.random();
                    if (wave >= 3 && rand < 0.35) type = 'striker';
                    if (wave >= 5 && rand < 0.15) type = 'tank';

                    enemies.push(new Enemy(ex, ey, type));
                }

                // Wave progression check
                if (enemiesToSpawn === 0 && enemies.length === 0) {
                    wave++;
                    spawnWave();
                    player.health = Math.min(player.maxHealth, player.health + 25);
                }

                // Update & Draw Player
                player.update();
                player.draw();

                // Update & Draw Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].update();
                    bullets[i].draw();

                    // Remove out of bounds bullets
                    if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }

                // Update & Draw PowerUps
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    powerUps[i].duration--;
                    powerUps[i].draw();

                    // Check player pickup
                    const dist = Math.hypot(player.x - powerUps[i].x, player.y - powerUps[i].y);
                    if (dist < player.radius + powerUps[i].radius) {
                        playSound('powerup');
                        if (powerUps[i].type === 'health') {
                            player.health = Math.min(player.maxHealth, player.health + 40);
                        } else if (powerUps[i].type === 'weapon') {
                            player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                        } else if (powerUps[i].type === 'shield') {
                            player.shield = player.maxShield;
                        }
                        powerUps.splice(i, 1);
                    } else if (powerUps[i].duration <= 0) {
                        powerUps.splice(i, 1);
                    }
                }

                // Update & Draw Enemies & Collisions
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let enemy = enemies[i];
                    enemy.update(player.x, player.y);
                    enemy.draw();

                    // Bullet collision with enemy
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let bullet = bullets[j];
                        const dist = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);
                        if (dist < enemy.radius + bullet.radius) {
                            enemy.health -= 20;
                            createExplosion(bullet.x, bullet.y, enemy.color, 5);
                            bullets.splice(j, 1);

                            if (enemy.health <= 0) {
                                createExplosion(enemy.x, enemy.y, enemy.color, 25);
                                score += enemy.points;

                                // Chance to drop power-up
                                if (Math.random() < 0.18) {
                                    const types = ['health', 'weapon', 'shield'];
                                    const pType = types[Math.floor(Math.random() * types.length)];
                                    powerUps.push(new PowerUp(enemy.x, enemy.y, pType));
                                }

                                enemies.splice(i, 1);
                                break;
                            }
                        }
                    }

                    // Enemy collision with player
                    if (enemies[i]) {
                        const playerDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        if (playerDist < player.radius + enemy.radius) {
                            playSound('hit');
                            createExplosion(enemy.x, enemy.y, '#ff0055', 15);
                            
                            let damage = 15;
                            if (player.shield > 0) {
                                player.shield -= 40;
                                if (player.shield < 0) {
                                    player.health += player.shield; // carry over damage
                                    player.shield = 0;
                                }
                            } else {
                                player.health -= damage;
                            }

                            enemies.splice(i, 1);

                            if (player.health <= 0) {
                                gameState = 'GAMEOVER';
                                document.getElementById('hud').classList.add('hidden');
                                document.getElementById('finalScore').innerText = score;
                                
                                let isNewHigh = false;
                                if (score > highScore) {
                                    highScore = score;
                                    localStorage.setItem('cyberstrike_highscore', highScore);
                                    document.getElementById('highScoreText').innerText = `HIGH SCORE: ${highScore}`;
                                    isNewHigh = true;
                                }
                                const notice = document.getElementById('newHighScoreNotice');
                                if (isNewHigh) notice.classList.remove('hidden');
                                else notice.classList.add('hidden');

                                document.getElementById('gameOverScreen').classList.remove('hidden');
                            }
                        }
                    }
                }

                // Update HUD DOM values
                document.getElementById('healthBar').style.width = Math.max(0, (player.health / player.maxHealth) * 100) + '%';
                document.getElementById('shieldBar').style.width = Math.max(0, (player.shield / player.maxShield) * 100) + '%';
                document.getElementById('scoreDisplay').innerText = String(score).padStart(6, '0');
            }

            requestAnimationFrame(gameLoop);
        }

        // Start animation frame loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
