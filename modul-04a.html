<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdom Rush Style Map - Alive Enemy Animations</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Monaco Editor (VS Code Engine) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header Bar -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <span class="flex h-3 w-3 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
      </span>
      <h1 class="text-base font-bold text-slate-100 tracking-wide">
        FANTASY TOWER DEFENSE <span class="text-xs bg-rose-600/30 text-rose-400 border border-rose-500/40 px-2 py-0.5 rounded font-mono ml-2">LIVELY ENEMY ANIMATIONS</span>
      </h1>
    </div>

    <div class="flex items-center space-x-3">
      <button id="run-btn" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-4 py-1.5 rounded-md transition-all flex items-center space-x-2 shadow-lg shadow-rose-600/30 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
        </svg>
        <span>Jalankan & Lihat Musuh!</span>
      </button>
    </div>
  </header>

  <!-- Workspace Area -->
  <main class="flex flex-1 w-full overflow-hidden">
    
    <!-- Code Editor Area -->
    <section class="w-1/2 border-r border-slate-800 flex flex-col">
      <div class="bg-slate-900/90 px-4 py-2 text-xs font-mono text-slate-400 border-b border-slate-800 flex justify-between">
        <span>game.js</span>
        <span class="text-slate-500">Animasi Langkah, Flip Arah, & Hit Reaction Aktif</span>
      </div>
      <div id="editor-container" class="w-full flex-1"></div>
    </section>

    <!-- Game Canvas Output Area -->
    <section class="w-1/2 flex flex-col bg-slate-950 relative">
      <div class="bg-slate-900/90 px-4 py-2 text-xs font-mono text-slate-400 border-b border-slate-800">
        <span>Pratinjau Live Phaser WebGL</span>
      </div>
      
      <div class="flex-1 flex items-center justify-center p-4">
        <iframe id="preview-iframe" class="w-[800px] h-[600px] border border-slate-800 rounded-lg shadow-2xl bg-black"></iframe>
      </div>
    </section>

  </main>

  <script>
    let editor;

    const starterCode = `// GAME TOWER DEFENSE - ANIMASI MUSUH LIVING & DYNAMIC (PHASER 3)
const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#3e7025',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    arcade: { debug: false }
  },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);

let enemies, towers, bullets, hpGraphics;
let money = 120, serverHP = 20, wave = 1;
let moneyText, hpText, waveText, waveBannerText, gameOverText;
let isGameOver = false;

// Manajemen Wave
let enemiesSpawned = 0;
let maxEnemiesThisWave = 6;
let isWaveActive = true;
let isWaveTransitioning = false;
let sceneRef = null;

// Titik Jalur Berkelok (Waypoints)
const waypoints = [
  { x: -20, y: 340 },
  { x: 110, y: 340 },
  { x: 110, y: 170 },
  { x: 290, y: 170 },
  { x: 290, y: 470 },
  { x: 500, y: 470 },
  { x: 500, y: 250 },
  { x: 820, y: 250 }
];

// Landasan Menara (Build Spots)
const buildSpots = [
  { x: 200, y: 260, occupied: false },
  { x: 200, y: 380, occupied: false },
  { x: 390, y: 360, occupied: false },
  { x: 400, y: 180, occupied: false },
  { x: 610, y: 160, occupied: false },
  { x: 610, y: 350, occupied: false },
  { x: 700, y: 160, occupied: false }
];

// Audio FX Synthesizer
const AudioFX = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e) {}
  },
  playLaser() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  },
  playBuild() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
    osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.18);
  },
  playExplode() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  },
  playDamage() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
    osc.frequency.setValueAtTime(50, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  },
  playFanfare() {
    if (!this.ctx) return;
    let now = this.ctx.currentTime;
    [400, 520, 660, 880].forEach((freq, idx) => {
      let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.1);
      gain.gain.setValueAtTime(0.1, now + idx * 0.1);
      gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.1); osc.stop(now + idx * 0.1 + 0.2);
    });
  }
};

function preload() {
  let g = this.make.graphics({ x: 0, y: 0, add: false });

  // 1. MAP BACKGROUND TEXTURE
  g.fillStyle(0x569b32, 1); g.fillRect(0, 0, 800, 600);
  g.fillStyle(0x4a8829, 1);
  g.fillCircle(150, 80, 70); g.fillCircle(350, 280, 90); g.fillCircle(700, 480, 110);
  g.fillCircle(60, 520, 80); g.fillCircle(650, 80, 80);

  const drawTree = (cx, cy, radius) => {
    g.fillStyle(0x35611c, 0.5); g.fillCircle(cx + 6, cy + 8, radius);
    g.fillStyle(0x5c3a1e, 1); g.fillRect(cx - 4, cy + radius - 6, 8, 12);
    g.fillStyle(0x1e5012, 1); g.fillCircle(cx, cy, radius);
    g.fillStyle(0x2d731b, 1); g.fillCircle(cx - radius*0.2, cy - radius*0.2, radius*0.75);
    g.fillStyle(0x439d28, 1); g.fillCircle(cx + radius*0.2, cy - radius*0.3, radius*0.5);
    g.fillStyle(0x61ba3f, 1); g.fillCircle(cx - radius*0.1, cy - radius*0.4, radius*0.3);
  };

  for (let x = 10; x <= 790; x += 38) {
    drawTree(x, 15, 22); if (x % 2 === 0) drawTree(x + 10, 38, 18);
  }
  for (let x = 15; x <= 780; x += 42) {
    drawTree(x, 585, 24); if (x % 3 === 0) drawTree(x - 12, 555, 19);
  }

  // Jalur Utama
  g.lineStyle(52, 0x7c582d, 1);
  g.beginPath(); g.moveTo(waypoints[0].x, waypoints[0].y);
  for (let i = 1; i < waypoints.length; i++) g.lineTo(waypoints[i].x, waypoints[i].y);
  g.strokePath();

  g.lineStyle(42, 0xd8b570, 1);
  g.beginPath(); g.moveTo(waypoints[0].x, waypoints[0].y);
  for (let i = 1; i < waypoints.length; i++) g.lineTo(waypoints[i].x, waypoints[i].y);
  g.strokePath();

  buildSpots.forEach(spot => {
    g.fillStyle(0x614421, 0.6); g.fillCircle(spot.x, spot.y + 3, 24);
    g.fillStyle(0xcca05e, 1); g.fillCircle(spot.x, spot.y, 22);
    g.lineStyle(3, 0x8c6231, 1); g.strokeCircle(spot.x, spot.y, 22);
  });

  g.generateTexture('map_bg', 800, 600);

  // 2. BOARD UI TOP
  g.clear();
  g.fillStyle(0x3a210d, 0.95); g.fillRoundedRect(0, 0, 460, 48, 10);
  g.lineStyle(3, 0xc69214, 1); g.strokeRoundedRect(0, 0, 460, 48, 10);
  g.generateTexture('ui_board', 460, 48);

  // 3. TOWER TEXTURE
  g.clear();
  g.fillStyle(0x4a4d55, 1); g.fillCircle(24, 66, 20); g.fillCircle(46, 68, 18);
  g.fillStyle(0x6b707c, 1); g.fillCircle(20, 64, 14); g.fillCircle(44, 66, 12);
  g.fillStyle(0x737883, 1); g.fillRect(18, 16, 36, 48);
  g.fillStyle(0x9fa5b2, 1); g.fillRect(22, 16, 28, 48);
  g.lineStyle(1, 0x484c54, 0.6);
  for (let y = 18; y < 64; y += 6) {
    g.lineBetween(18, y, 54, y);
    let offset = ((y / 6) % 2 === 0) ? 0 : 4;
    for (let x = 18 + offset; x < 54; x += 8) g.lineBetween(x, y, x, y + 6);
  }
  g.fillStyle(0x5c616b, 1); g.fillRect(14, 10, 44, 8);
  g.fillStyle(0x9fa5b2, 1); g.fillRect(16, 10, 40, 6);
  g.fillStyle(0x8e94a0, 1);
  g.fillRect(14, 3, 9, 8); g.fillRect(27, 3, 8, 8); g.fillRect(39, 3, 8, 8); g.fillRect(50, 3, 8, 8);
  g.fillStyle(0x1c1e24, 1); g.fillRoundedRect(31, 20, 10, 14, { tl: 5, tr: 5, bl: 0, br: 0 });
  g.fillStyle(0x38bdf8, 1); g.fillCircle(36, 27, 3);
  g.generateTexture('tower', 72, 76);

  // 4. ENEMY TEXTURE (Gladiator Karakter)
  g.clear();
  g.fillStyle(0x991b1b, 1); g.fillTriangle(20, 16, 8, 48, 26, 48); // Jubah Merah
  g.fillStyle(0xe5d0ac, 1); g.fillRect(18, 38, 5, 12); g.fillRect(25, 38, 5, 12); // Kaki
  g.fillStyle(0xf5f5f4, 1); g.fillRect(16, 22, 16, 18); // Zirah Dada
  g.fillStyle(0x1c1917, 1); g.fillRect(17, 20, 14, 12);
  g.fillRect(17, 32, 3, 7); g.fillRect(21, 32, 3, 7); g.fillRect(25, 32, 3, 7);
  g.fillStyle(0xe5d0ac, 1); g.fillCircle(24, 12, 7); // Kepala
  g.fillStyle(0x292524, 1); g.fillCircle(24, 9, 7); g.fillRect(17, 10, 14, 2); // Helm
  g.fillStyle(0x78350f, 1); g.fillCircle(35, 27, 9); // Tameng
  g.lineStyle(2, 0xe2e8f0, 1); g.lineBetween(13, 28, 6, 35); // Pedang
  g.generateTexture('enemy', 48, 52);

  // 5. BULLET TEXTURE
  g.clear();
  g.fillStyle(0xfacc15, 1); g.fillCircle(6, 6, 6);
  g.fillStyle(0xffffff, 1); g.fillCircle(6, 6, 3);
  g.generateTexture('bullet', 12, 12);
}

function create() {
  sceneRef = this;
  const unlockAudio = () => { AudioFX.init(); };
  this.input.on('pointerdown', unlockAudio);

  // Map & UI Render
  this.add.image(400, 300, 'map_bg');
  this.add.image(400, 32, 'ui_board');

  moneyText = this.add.text(200, 22, '🪙 ' + money, { fontSize: '20px', fill: '#facc15', fontStyle: 'bold', fontFamily: 'Georgia' });
  waveText = this.add.text(340, 22, '⚔️ WAVE ' + wave, { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold', fontFamily: 'Georgia' });
  hpText = this.add.text(520, 22, '❤️ ' + serverHP, { fontSize: '20px', fill: '#ef4444', fontStyle: 'bold', fontFamily: 'Georgia' });

  // Groups & Canvas Graphics
  towers = this.physics.add.group();
  enemies = this.physics.add.group();
  bullets = this.physics.add.group();
  hpGraphics = this.add.graphics();

  // Interaksi Pasang Menara
  this.input.on('pointerdown', (pointer) => {
    if (isGameOver) return;

    buildSpots.forEach(spot => {
      let dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, spot.x, spot.y);
      if (dist < 30 && !spot.occupied) {
        if (money >= 60) {
          money -= 60;
          spot.occupied = true;
          moneyText.setText('🪙 ' + money);

          let tower = towers.create(spot.x, spot.y - 18, 'tower');
          tower.range = 185;
          tower.damage = 35;
          tower.lastFired = 0;

          tower.setScale(0.2);
          sceneRef.tweens.add({
            targets: tower,
            scaleX: 1,
            scaleY: 1,
            duration: 300,
            ease: 'Back.easeOut'
          });

          AudioFX.playBuild();
        }
      }
    });
  });

  // Timer Spawn Musuh
  this.time.addEvent({
    delay: 1800,
    callback: spawnEnemy,
    callbackScope: this,
    loop: true
  });

  showWaveBanner('⚔️ WAVE 1 BERMULAI!');
}

function update(time, delta) {
  if (isGameOver) {
    if (this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE).isDown) {
      restartGame.call(this);
    }
    return;
  }

  // 1. Render Bayangan Kaki Musuh & Health Bar
  hpGraphics.clear();
  enemies.children.iterate(function (enemy) {
    if (!enemy || !enemy.active) return;

    // Bayangan Tanah Kaki Musuh (Ground Shadow)
    hpGraphics.fillStyle(0x000000, 0.25);
    hpGraphics.fillEllipse(enemy.x, enemy.y + 18, 26, 8);

    // Health Bar Musuh
    if (enemy.health < enemy.maxHealth) {
      let barW = 30, barH = 4;
      let pct = Math.max(0, enemy.health / enemy.maxHealth);
      let x = enemy.x - barW / 2;
      let y = enemy.y - 32;

      hpGraphics.fillStyle(0x000000, 0.7);
      hpGraphics.fillRect(x, y, barW, barH);
      hpGraphics.fillStyle(0xef4444, 1);
      hpGraphics.fillRect(x, y, barW * pct, barH);
    }
  });

  // 2. Pergerakan Musuh & Animasi Langkah (Walk Cycle & Flip)
  enemies.children.iterate(function (enemy) {
    if (!enemy || !enemy.active) return;

    // A. Animasi Mengayun Saat Berjalan (Bobbing/Wobble Walk Cycle)
    let walkCycle = Math.sin(time * 0.015 + enemy.spawnOffset);
    enemy.setRotation(walkCycle * 0.12); // Ayunan tubuh miring kiri-kanan
    enemy.setScale(1 + walkCycle * 0.05, 1 - walkCycle * 0.05); // Efek melangkah membal

    // B. Perhitungan Arah Jalur Waypoint
    let target = waypoints[enemy.waypointIndex];
    let dx = target.x - enemy.x;
    let dy = target.y - enemy.y;
    let distance = Math.sqrt(dx * dx + dy * dy);

    // C. Berbalik Arah Menghadap Arah Jalan (Flip Direction)
    if (dx < -0.5) {
      enemy.setFlipX(true);  // Menghadap Kiri saat berjalan ke kiri
    } else if (dx > 0.5) {
      enemy.setFlipX(false); // Menghadap Kanan saat berjalan ke kanan
    }

    if (distance < 5) {
      enemy.waypointIndex++;
      if (enemy.waypointIndex >= waypoints.length) {
        enemy.destroy();
        serverHP -= 1;
        if (serverHP < 0) serverHP = 0;
        hpText.setText('❤️ ' + serverHP);
        AudioFX.playDamage();

        if (serverHP <= 0) {
          triggerGameOver.call(this);
        }
      }
    } else {
      let speed = enemy.speed || 2;
      enemy.x += (dx / distance) * speed;
      enemy.y += (dy / distance) * speed;
    }
  }, this);

  // 3. Penembakan Menara
  towers.children.iterate(function (tower) {
    if (!tower) return;

    let closestEnemy = null;
    let minDistance = tower.range;

    enemies.children.iterate(function (enemy) {
      if (!enemy || !enemy.active) return;
      let dist = Phaser.Math.Distance.Between(tower.x, tower.y, enemy.x, enemy.y);
      if (dist < minDistance) {
        minDistance = dist;
        closestEnemy = enemy;
      }
    });

    if (closestEnemy && time > tower.lastFired) {
      shootAtEnemy.call(this, tower, closestEnemy);
      tower.lastFired = time + 700;
    }
  }, this);

  // 4. Deteksi Transisi Wave
  if (isWaveActive && enemiesSpawned >= maxEnemiesThisWave && enemies.countActive(true) === 0 && !isWaveTransitioning) {
    isWaveActive = false;
    isWaveTransitioning = true;

    let bonusGold = 35 + wave * 10;
    money += bonusGold;
    moneyText.setText('🪙 ' + money);

    AudioFX.playFanfare();
    showWaveBanner('✨ WAVE ' + wave + ' SELESAI! ✨\\nBonus: +' + bonusGold + ' Emas');

    this.time.delayedCall(3500, () => {
      if (!isGameOver) {
        startNextWave();
      }
    });
  }
}

function startNextWave() {
  wave++;
  waveText.setText('⚔️ WAVE ' + wave);
  enemiesSpawned = 0;
  maxEnemiesThisWave = 6 + (wave * 3);
  isWaveActive = true;
  isWaveTransitioning = false;

  showWaveBanner('⚔ WAVE ' + wave + ' BERMULAI!\\n[ Musuh Semakin Kuat ]');
}

function spawnEnemy() {
  if (isGameOver || !isWaveActive) return;

  if (enemiesSpawned < maxEnemiesThisWave) {
    let enemy = enemies.create(waypoints[0].x, waypoints[0].y, 'enemy');
    enemy.waypointIndex = 1;
    enemy.maxHealth = 80 + (wave - 1) * 40;
    enemy.health = enemy.maxHealth;
    enemy.speed = 1.6 + (wave - 1) * 0.12 + Math.random() * 0.4;
    enemy.spawnOffset = Math.random() * 100; // Offset unik agar irama jalan tiap musuh beda

    enemiesSpawned++;
  }
}

function shootAtEnemy(tower, enemy) {
  // Animasi Recoil Menara
  sceneRef.tweens.add({
    targets: tower,
    scaleY: 0.85,
    scaleX: 1.15,
    duration: 80,
    yoyo: true,
    ease: 'Quad.easeInOut'
  });

  // Muzzle Flash
  let flash = sceneRef.add.circle(tower.x, tower.y - 28, 10, 0xfacc15);
  sceneRef.tweens.add({
    targets: flash,
    alpha: 0,
    scale: 2,
    duration: 140,
    onComplete: () => flash.destroy()
  });

  let bullet = bullets.create(tower.x, tower.y - 25, 'bullet');
  AudioFX.playLaser();

  this.physics.moveToObject(bullet, enemy, 480);

  this.physics.add.overlap(bullet, enemy, (b, e) => {
    b.destroy();
    e.health -= tower.damage;

    // ==========================================
    // EFEK HIT FLASH (Musuh Berkedip Merah Terang Saat Terkena Peluru)
    // ==========================================
    e.setTint(0xff3333);
    sceneRef.time.delayedCall(120, () => {
      if (e && e.active) e.clearTint();
    });

    if (e.health <= 0) {
      // Efek Partikel Ledakan Kematian Musuh
      createDeathParticles(e.x, e.y);

      e.destroy();
      AudioFX.playExplode();
      money += 15;
      moneyText.setText('🪙 ' + money);
    }
  }, null, this);
}

// Efek Partikel Kematian Musuh saat Kalah
function createDeathParticles(x, y) {
  for (let i = 0; i < 7; i++) {
    let p = sceneRef.add.circle(x, y, Phaser.Math.Between(3, 7), 0xd97706);
    let angle = Math.random() * Math.PI * 2;
    let speed = Phaser.Math.Between(20, 70);

    sceneRef.tweens.add({
      targets: p,
      x: x + Math.cos(angle) * speed,
      y: y + Math.sin(angle) * speed,
      alpha: 0,
      scale: 0,
      duration: 380,
      ease: 'Power2',
      onComplete: () => p.destroy()
    });
  }
}

function showWaveBanner(msg) {
  if (waveBannerText) waveBannerText.destroy();

  waveBannerText = sceneRef.add.text(400, 220, msg, {
    fontSize: '24px', fill: '#facc15', align: 'center', fontStyle: 'bold', fontFamily: 'Georgia',
    stroke: '#000000', strokeThickness: 5
  }).setOrigin(0.5);

  sceneRef.tweens.add({
    targets: waveBannerText,
    alpha: { from: 1, to: 0 },
    y: 180,
    duration: 3000,
    ease: 'Power2',
    onComplete: () => {
      if (waveBannerText) waveBannerText.destroy();
    }
  });
}

function triggerGameOver() {
  isGameOver = true;
  this.physics.pause();
  AudioFX.playDamage();

  gameOverText = this.add.text(400, 300, 'KERAJAAN TELAH JATUH!\\nBertahan Hingga Wave ' + wave + '\\n\\n[ Tekan SPASI untuk Ulang ]', {
    fontSize: '26px', fill: '#ef4444', align: 'center', fontStyle: 'bold', fontFamily: 'Georgia',
    shadow: { offsetX: 0, offsetY: 0, color: '#000000', blur: 10, stroke: true, fill: true }
  }).setOrigin(0.5);
}

function restartGame() {
  money = 120;
  serverHP = 20;
  wave = 1;
  enemiesSpawned = 0;
  maxEnemiesThisWave = 6;
  isWaveActive = true;
  isWaveTransitioning = false;
  isGameOver = false;

  buildSpots.forEach(spot => spot.occupied = false);

  if (gameOverText) gameOverText.destroy();
  if (hpGraphics) hpGraphics.clear();

  enemies.clear(true, true);
  bullets.clear(true, true);
  towers.clear(true, true);

  moneyText.setText('🪙 ' + money);
  hpText.setText('❤️ ' + serverHP);
  waveText.setText('⚔️ WAVE ' + wave);

  this.physics.resume();
  showWaveBanner('⚔️ WAVE 1 BERMULAI!');
}
