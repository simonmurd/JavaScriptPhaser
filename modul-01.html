  ctx: null,
  init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  playLaser() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator();
    let gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);

    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);

  playExplode() {
    if (!this.ctx) return;
    let osc = this.ctx.createOscillator();
    let gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);

function create() {
  this.input.once('pointerdown', () => AudioFX.init());

  // Parallax Scrolling Terrain Background
  terrainBg = this.add.tileSprite(0, 0, 450, 600, 'terrainBg').setOrigin(0, 0);

  // Player Jet
  player = this.physics.add.sprite(225, 520, 'playerShip').setCollideWorldBounds(true);
  player.body.setSize(12, 12).setOffset(26, 26);

  // Thruster Particle
  emitterThruster = this.add.particles(0, 0, 'thrusterParticle', {
    speedY: { min: 100, max: 180 },
    scale: { start: 1.2, end: 0 },
    blendMode: 'ADD',
    lifespan: 220
  });
  emitterThruster.startFollow(player, 0, 26);

  // Groups
  bullets = this.physics.add.group({ defaultKey: 'bulletRed', maxSize: 60 });
  enemyBullets = this.physics.add.group({ defaultKey: 'bulletEnemy', maxSize: 50 });
  homingLasers = this.physics.add.group({ defaultKey: 'laserBlue', maxSize: 20 });
  enemies = this.physics.add.group();
  tanks = this.physics.add.group();
  powerups = this.physics.add.group();

  // Explosion Particle System
  emitterExplode = this.add.particles(0, 0, 'particle', {
    speed: { min: 50, max: 250 },
    scale: { start: 2.0, end: 0 },
    blendMode: 'ADD',
    lifespan: 400,
    emitting: false
  });

  // UI / HUD Header
  scoreText = this.add.text(16, 16, 'SCORE: 0000', { fontSize: '14px', color: '#00ffcc', fontFamily: 'monospace' });
  hpText = this.add.text(16, 36, 'HP: 100%', { fontSize: '14px', color: '#ff4444', fontFamily: 'monospace' });
  weaponLevelText = this.add.text(330, 16, 'PWR: LV1', { fontSize: '14px', color: '#facc15', fontFamily: 'monospace' });

  // Timers Spawner Musuh
  this.time.addEvent({ delay: 1000, callback: spawnEnemy, callbackScope: this, loop: true });
  this.time.addEvent({ delay: 2200, callback: spawnTank, callbackScope: this, loop: true });

  // Collisions
  this.physics.add.overlap(bullets, enemies, destroyEnemy, null, this);
  this.physics.add.overlap(bullets, tanks, destroyEnemy, null, this);
  this.physics.add.overlap(homingLasers, enemies, destroyEnemy, null, this);
  this.physics.add.overlap(homingLasers, tanks, destroyEnemy, null, this);
  this.physics.add.overlap(enemyBullets, player, hitPlayer, null, this);
  this.physics.add.overlap(enemies, player, hitPlayer, null, this);
  this.physics.add.overlap(tanks, player, hitPlayer, null, this);
  this.physics.add.overlap(powerups, player, collectPowerup, null, this);

  // Smooth Pointer Controls
  this.input.on('pointermove', (pointer) => {
    player.x = Phaser.Math.Clamp(pointer.x, 20, 430);
    player.y = Phaser.Math.Clamp(pointer.y, 20, 580);
  });
}

function update(time) {
  // Scrolling Terain Vertikal
  terrainBg.tilePositionY -= 1.2;

  // Auto Firing Rate
  if (time > lastFired && player.active) {
    fireWeapons.call(this);
    lastFired = time + (160 - weaponLevel * 10);
  }

  // Clean-up Out-of-Bounds Bullets
  bullets.children.each(b => { if (b.active && b.y < -10) b.setActive(false).setVisible(false); });
  enemyBullets.children.each(b => { if (b.active && (b.y > 610 || b.y < -10)) b.setActive(false).setVisible(false); });

  // Homing Rocket Logic
  homingLasers.children.each((laser) => {
    if (laser.active) {
      let target = getClosestEnemy(laser);
      if (target) {
        let angle = Phaser.Math.Angle.Between(laser.x, laser.y, target.x, target.y);
        laser.setRotation(angle + Math.PI / 2);
        this.physics.velocityFromRotation(angle, 480, laser.body.velocity);
      } else {
        laser.setVelocityY(-480);
        laser.setRotation(0);
      }
      if (laser.y < -20) laser.setActive(false).setVisible(false);
    }
  }, this);
}

function fireWeapons() {
  AudioFX.playLaser();
  if (weaponLevel === 1) {
    spawnBullet(this, player.x, player.y - 28, 0, -580);
  } else if (weaponLevel === 2) {
    spawnBullet(this, player.x - 12, player.y - 20, -0.05, -580);
    spawnBullet(this, player.x + 12, player.y - 20, 0.05, -580);
  } else {
    const angles = [-0.2, 0, 0.2];
    angles.forEach(ang => spawnBullet(this, player.x, player.y - 28, ang, -580));
    let laser = homingLasers.get(player.x, player.y - 20);
    if (laser) laser.setActive(true).setVisible(true);
  }
}

function spawnBullet(scene, x, y, angleOffset, speed) {
  let b = bullets.get(x, y);
  if (b) {
    b.setActive(true).setVisible(true);
    scene.physics.velocityFromRotation(-Math.PI / 2 + angleOffset, Math.abs(speed), b.body.velocity);
  }
}

function spawnEnemy() {
  let x = Phaser.Math.Between(40, 410);
  let enemy = enemies.create(x, -30, 'enemyShip');
  enemy.body.setSize(24, 24).setOffset(20, 20);
  enemy.setVelocityY(Phaser.Math.Between(90, 160));
  
  this.time.addEvent({
    delay: Phaser.Math.Between(1000, 1800),
    callback: () => {
      if (enemy.active && player.active) {
        let eb = enemyBullets.get(enemy.x, enemy.y + 20);
        if (eb) {
          eb.setActive(true).setVisible(true);
          this.physics.moveToObject(eb, player, 220);
        }
      }
    },
    loop: false
  });
}

function spawnTank() {
  let x = Phaser.Math.Between(100, 380);
  let tank = tanks.create(x, -48, 'tankEnemy');
  tank.body.setSize(32, 32).setOffset(8, 8);
  tank.setVelocityY(40);

  this.time.addEvent({
    delay: 1400,
    callback: () => {
      if (tank.active && player.active) {
        let angle = Phaser.Math.Angle.Between(tank.x, tank.y, player.x, player.y);
        tank.setRotation(angle - Math.PI / 2);

        let eb = enemyBullets.get(tank.x, tank.y);
        if (eb) {
          eb.setActive(true).setVisible(true);
          this.physics.velocityFromRotation(angle, 200, eb.body.velocity);
        }
      }
    },
    repeat: 2
  });
}

function destroyEnemy(projectile, enemy) {
  projectile.setActive(false).setVisible(false);

  enemy.setTint(0xffffff);
  this.time.delayedCall(50, () => { if (enemy.active) enemy.clearTint(); });

  emitterExplode.explode(25, enemy.x, enemy.y);
  this.cameras.main.shake(80, 0.008);
  AudioFX.playExplode();

  let points = enemy.texture.key === 'tankEnemy' ? 150 : 100;
  showFloatingText(this, enemy.x, enemy.y, '+' + points);

  if (Phaser.Math.Between(1, 100) <= 20) {
    let p = powerups.create(enemy.x, enemy.y, 'powerup');
    p.setVelocityY(80);
  }

  score += points;
  scoreText.setText('SCORE: ' + String(score).padStart(4, '0'));
  enemy.destroy();
}

function hitPlayer(playerObj, hazard) {
  hazard.destroy ? hazard.destroy() : hazard.setActive(false).setVisible(false);

  playerHp -= 15;
  hpText.setText('HP: ' + Math.max(0, playerHp) + '%');
  this.cameras.main.shake(150, 0.02);

  player.setTint(0xff0000);
  this.time.delayedCall(100, () => player.clearTint());

  if (playerHp <= 0) {
    emitterExplode.explode(60, player.x, player.y);
    emitterThruster.stop();
    player.setActive(false).setVisible(false);
    this.add.text(130, 280, 'GAME OVER', { fontSize: '32px', color: '#ef4444', fontFamily: 'monospace' });
  }
}

function collectPowerup(playerObj, powerup) {
  powerup.destroy();
  if (weaponLevel < 3) weaponLevel++;
  weaponLevelText.setText('PWR: LV' + weaponLevel);
  showFloatingText(this, player.x, player.y - 20, 'POWER UP!', '#38bdf8');
}

function showFloatingText(scene, x, y, msg, color = '#facc15') {
  let txt = scene.add.text(x, y, msg, { fontSize: '12px', color: color, fontFamily: 'monospace' }).setOrigin(0.5);
  scene.tweens.add({
    targets: txt,
    y: y - 30,
    alpha: 0,
    duration: 600,
    onComplete: () => txt.destroy()
  });
}

function getClosestEnemy(src) {
  let closest = null;
  let minDistance = 9999;
  
  const allTargets = [...enemies.getChildren(), ...tanks.getChildren()];
  allTargets.forEach(e => {
    if (e.active) {
      let dist = Phaser.Math.Distance.Between(src.x, src.y, e.x, e.y);
      if (dist < minDistance) {
        minDistance = dist;
        closest = e;
      }
    }
  });
  return closest;
}

    require(['vs/editor/editor.main'], function() {

        value: starterCode,
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false }
      });
    });

    // Jalankan Kode ke iFrame Sandbox
    function runCode() {
      const userCode = editor.getValue();
      const iframe = document.getElementById('preview-iframe');

      const iframeContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body { margin: 0; padding: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
            canvas { border-radius: 6px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
          </style>
          <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"><\/script>
        </head>
        <body>
          <script>
            try {
              ${userCode}
            } catch (err) {
              document.body.innerHTML = '<pre style="color: #ef4444; padding: 15px; font-family: monospace; font-size: 12px;">' + err + '</pre>';
            }
          <\/script>
        </body>
        </html>
      `;

      iframe.srcdoc = iframeContent;
    }

    document.getElementById('run-btn').addEventListener('click', runCode);
    setTimeout(runCode, 1000);
  </script>
</body>
</html>
