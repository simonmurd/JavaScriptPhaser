<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset Run - 90s Arcade Racer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden font-sans">

  <header class="h-14 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <span class="flex h-3 w-3 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-500 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-pink-600"></span>
      </span>
      <h1 class="text-base font-bold text-slate-100 tracking-wide">
        SUNSET RUN <span class="text-xs bg-pink-600/30 text-pink-400 border border-pink-500/40 px-2 py-0.5 rounded font-mono ml-2">90S ARCADE RACER</span>
      </h1>
    </div>

    <div class="flex items-center space-x-3">
      <button id="run-btn" class="bg-pink-600 hover:bg-pink-500 text-white font-semibold px-4 py-1.5 rounded-md transition-all flex items-center space-x-2 shadow-lg shadow-pink-600/30 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
        </svg>
        <span>Start Engine!</span>
      </button>
    </div>
  </header>

  <main class="flex flex-1 w-full overflow-hidden">
    <section class="w-1/2 border-r border-slate-800 flex flex-col">
      <div class="bg-slate-900/90 px-4 py-2 text-xs font-mono text-slate-400 border-b border-slate-800 flex justify-between">
        <span>sunset-run.js</span>
        <span class="text-slate-500">Pseudo-3D Road & 90s Arcade Racing</span>
      </div>
      <div id="editor-container" class="w-full flex-1"></div>
    </section>

    <section class="w-1/2 flex flex-col bg-slate-950 relative">
      <div class="bg-slate-900/90 px-4 py-2 text-xs font-mono text-slate-400 border-b border-slate-800">
        <span>Pratinjau Live Canvas HTML5</span>
      </div>
      
      <div class="flex-1 flex items-center justify-center p-4">
        <iframe id="preview-iframe" class="w-full max-w-[800px] aspect-[4/3] border border-slate-800 rounded-lg shadow-2xl bg-black"></iframe>
      </div>
    </section>
  </main>

  <script src="./modul-05-game.js"></script>
  <script>
    let editor;

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: window.OUTRUN_STARTER_CODE,
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false }
      });
      runCode();
    });

    function runCode() {
      if (!editor) return;
      const userCode = editor.getValue();
      const iframe = document.getElementById('preview-iframe');

      const iframeContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body { margin: 0; padding: 0; overflow: hidden; background: #0b0f19; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
            canvas { display: block; box-sizing: border-box; width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 0 35px rgba(236, 72, 153, 0.3); border: 2px solid #334155; }
          </style>
        </head>
        <body>
          <canvas id="gameCanvas" width="800" height="600"></canvas>
          <script>
            try {
              ${userCode}
            } catch (err) {
              document.body.innerHTML = '<pre style="color: #ef4444; padding: 15px; font-family: monospace; font-size: 13px; white-space: pre-wrap;">Runtime Error: ' + err.message + '</pre>';
            }
          <\/script>
        </body>
        </html>
      `;
      iframe.srcdoc = iframeContent;
    }

    document.getElementById('run-btn').addEventListener('click', runCode);
  </script>
</body>
</html>
